name: Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan commits introduced by this change
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$HEAD_SHA"
          elif git cat-file -e "$HEAD_SHA^^{commit}" 2>/dev/null; then
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          echo "Scanning $RANGE"
          gitleaks detect --no-banner --redact --log-opts="$RANGE"
